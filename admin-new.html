<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题助手 · 管理后台</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
  .container{max-width:1000px;margin:0 auto;padding:20px}
  .header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 24px;border-radius:12px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  .header h1{font-size:20px}
  .header a{font-size:14px;color:#1bcfad;text-decoration:none}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabs button{padding:10px 20px;border:none;border-radius:10px;font-size:14px;cursor:pointer;background:#fff;color:#666}
  .tabs button.active{background:#1bcfad;color:#fff}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .input,.select,.textarea{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
  .input:focus,.textarea:focus{outline:none;border-color:#1bcfad}
  .textarea{min-height:80px;resize:vertical}
  .select{background:#fff}
  .btn{padding:8px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .btn:active{transform:scale(0.97)}
  .btn-p{background:#1bcfad;color:#fff}
  .btn-s{background:#fff;color:#333;border:1px solid #ddd}
  .btn-r{background:#e74c3c;color:#fff}
  .btn-xs{padding:4px 12px;font-size:12px;border-radius:6px}
  label{font-size:13px;color:#666;display:block;margin-bottom:4px}
  .field{margin-bottom:14px}
  .tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px}
  .tag-g{background:rgba(27,207,173,0.12);color:#1bcfad}
  .tag-r{background:rgba(231,76,60,0.12);color:#e74c3c}

  .set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .set-card .name{font-size:17px;font-weight:600;margin-bottom:4px}
  .set-card .desc{font-size:13px;color:#999;margin-bottom:10px}
  .set-card .btns{display:flex;gap:6px;flex-wrap:wrap}

  .q-table{width:100%;border-collapse:collapse}
  .q-table th{background:#fafafa;color:#666;font-weight:500;font-size:12px}
  .q-table th,.q-table td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:top}

  .record-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
  .record-row:last-child{border:none}
  .score{font-size:28px;font-weight:700}
  .score.pf{color:#FF6F00}
  .score:not(.pf){color:#4CAF50}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:24px}
  .modal h2{font-size:18px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1;padding:12px;font-size:15px;justify-content:center}
  .upload-area{border:2px dashed #ddd;border-radius:10px;padding:20px;text-align:center;cursor:pointer;margin-bottom:8px}
  .upload-area:hover{border-color:#1bcfad;background:rgba(27,207,173,0.03)}
  .upload-area img{max-width:100%;max-height:120px;border-radius:8px;margin-bottom:6px}
  .upload-area span{font-size:13px;color:#999}
  .csv-help{font-size:12px;color:#999;line-height:1.6;background:#fafafa;padding:10px;border-radius:8px;margin-bottom:10px}
  .csv-help code{background:#eee;padding:1px 4px;border-radius:3px;font-size:11px}
  .csv-area{width:100%;height:140px;font-family:monospace;font-size:12px}

  .option-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .option-row .code{width:28px;font-weight:600;font-size:14px;color:#999;text-align:center;flex-shrink:0}
  .option-row .opt-input{flex:1}
  .option-row label{font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙️ 答题助手 · 管理后台</h1>
    <a href="index.html">🏠 返回首页</a>
  </div>

  <div class="tabs">
    <button class="active" data-tab="sets">📦 套装管理</button>
    <button data-tab="questions">📝 题目管理</button>
    <button data-tab="records">📊 答题记录</button>
  </div>

  <!-- 套装管理 -->
  <div class="tab-panel active" id="panel-sets">
    <div class="row"><button class="btn btn-p" onclick="openSetModal()">+ 创建新套装</button></div>
    <div class="set-grid" id="setGrid"></div>
  </div>

  <!-- 题目管理 -->
  <div class="tab-panel" id="panel-questions">
    <div class="card">
      <div class="row">
        <select class="select" id="qSetFilter" onchange="loadQuestions()" style="max-width:220px"><option value="">请先选择套装</option></select>
        <button class="btn btn-p" onclick="openQModal()">+ 逐条添加</button>
        <button class="btn btn-s" onclick="openCSVModal()">📤 CSV 批量导入</button>
      </div>
      <table class="q-table"><thead><tr><th style="width:40%">题目</th><th style="width:10%">题型</th><th style="width:10%">答案</th><th style="width:15%">操作</th></tr></thead><tbody id="qBody"><tr><td colspan="4" style="color:#999;text-align:center;padding:30px">请先选择套装</td></tr></tbody></table>
    </div>
  </div>

  <!-- 答题记录 -->
  <div class="tab-panel" id="panel-records">
    <div class="card"><div id="recordList"></div></div>
  </div>
</div>

<!-- 套装模态框 -->
<div class="modal-overlay" id="setModalOverlay">
  <div class="modal">
    <h2 id="setModalTitle">创建新套装</h2>
    <input type="hidden" id="setId">
    <div class="field"><label>套装名称 *</label><input class="input" id="setName" placeholder="例如：2024期中考试"></div>
    <div class="field"><label>描述</label><textarea class="textarea" id="setDesc" placeholder="简短描述（可选）"></textarea></div>
    <div class="field"><label>🏆 满分恭喜海报（可选）</label>
      <div class="upload-area" onclick="document.getElementById('perfectFile').click()">
        <img id="perfectPreview" src="" style="display:none">
        <span id="perfectPlaceholder">点击上传图片</span>
      </div>
      <input type="file" id="perfectFile" accept="image/*" style="display:none" onchange="handleUpload('perfect')">
      <input type="hidden" id="perfectUrl">
    </div>
    <div class="field"><label>👏 鼓励恭喜海报（可选）</label>
      <div class="upload-area" onclick="document.getElementById('normalFile').click()">
        <img id="normalPreview" src="" style="display:none">
        <span id="normalPlaceholder">点击上传图片</span>
      </div>
      <input type="file" id="normalFile" accept="image/*" style="display:none" onchange="handleUpload('normal')">
      <input type="hidden" id="normalUrl">
    </div>
    <div class="modal-actions">
      <button class="btn btn-s" onclick="closeSetModal()">取消</button>
      <button class="btn btn-p" onclick="saveSet()">保存</button>
    </div>
  </div>
</div>

<!-- 题目模态框 -->
<div class="modal-overlay" id="qModalOverlay">
  <div class="modal">
    <h2 id="qModalTitle">添加题目</h2>
    <input type="hidden" id="qId">
    <div class="field"><label>题型</label><select class="select" id="qType" onchange="renderOptionInputs()"><option value="single">单选题</option><option value="multi">多选题</option><option value="judge">判断题</option></select></div>
    <div class="field"><label>题目内容 *</label><textarea class="textarea" id="qTitle" placeholder="请输入题目文字"></textarea></div>
    <div class="field"><label>选项（勾选 = 正确答案）</label><div id="qOptionsContainer"></div></div>
    <div class="modal-actions">
      <button class="btn btn-s" onclick="closeQModal()">取消</button>
      <button class="btn btn-p" onclick="saveQ()">保存</button>
    </div>
  </div>
</div>

<!-- CSV 导入模态框 -->
<div class="modal-overlay" id="csvModalOverlay">
  <div class="modal">
    <h2>📤 CSV 批量导入题目</h2>
    <div class="csv-help">
      每行一道题，用逗号分隔：
      <code>题目,题型,正确答案,选项A,选项B,选项C,选项D</code><br>
      题型写：<code>单选</code> / <code>多选</code> / <code>判断</code>；答案写字母如 <code>B</code> 或 <code>AB</code><br>
      <b>示例</b>：微信是哪年上线的？,单选,B,2012年,2011年,2013年,2014年
    </div>
    <textarea class="textarea csv-area" id="csvText" placeholder="在此粘贴 CSV 内容...&#10;&#10;题目1,单选,B,选项A,选项B,选项C,选项D&#10;题目2,多选,AC,选项A,选项B,选项C,选项D&#10;题目3,判断,A,正确,错误"></textarea>
    <div class="modal-actions">
      <button class="btn btn-s" onclick="closeCSVModal()">取消</button>
      <button class="btn btn-p" onclick="importCSV()">导入</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
// ===== 公共 =====
function toast(msg){ const e=document.getElementById('dummy'); if(e){e.textContent=msg} alert(msg) }

// ===== Tab 切换 =====
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const t=b.dataset.tab;
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+t).classList.add('active');
    if(t==='sets')loadSets();
    if(t==='questions'){loadSetFilter().then(()=>loadQuestions())}
    if(t==='records')loadRecords();
  }
});

// ===== 套装管理 =====
async function loadSets(){
  const {data,error}=await supabase.from('question_sets').select('*').order('created_at',{ascending:false});
  if(error){alert('加载套装失败: '+error.message);return}
  document.getElementById('setGrid').innerHTML=(data||[]).map(s=>`
    <div class="card set-card">
      <div class="name">${s.name}</div>
      <div class="desc">${s.description||'暂无描述'}${s.perfect_poster_url?' · 🏆有满分海报':''}${s.normal_poster_url?' · 👏有鼓励海报':''}</div>
      <div class="btns">
        <button class="btn btn-xs btn-s" onclick="editSet('${s.id}')">编辑</button>
        <button class="btn btn-xs btn-r" onclick="deleteSet('${s.id}')">删除</button>
      </div>
    </div>`).join('')||'<p style="color:#999;text-align:center;padding:40px">暂无套装，点击上方按钮创建</p>';
}

function openSetModal(id){
  if(id){
    document.getElementById('setModalTitle').textContent='编辑套装';
    supabase.from('question_sets').select('*').eq('id',id).single().then(({data})=>{
      if(!data)return;
      document.getElementById('setId').value=data.id;
      document.getElementById('setName').value=data.name;
      document.getElementById('setDesc').value=data.description||'';
      document.getElementById('perfectUrl').value=data.perfect_poster_url||'';
      document.getElementById('normalUrl').value=data.normal_poster_url||'';
      if(data.perfect_poster_url){showPreview('perfect',data.perfect_poster_url)}
      if(data.normal_poster_url){showPreview('normal',data.normal_poster_url)}
    });
  } else {
    document.getElementById('setModalTitle').textContent='创建新套装';
    document.getElementById('setId').value='';
    document.getElementById('setName').value='';
    document.getElementById('setDesc').value='';
    document.getElementById('perfectUrl').value='';
    document.getElementById('normalUrl').value='';
    hidePreview('perfect'); hidePreview('normal');
  }
  document.getElementById('setModalOverlay').classList.add('show');
}

function closeSetModal(){ document.getElementById('setModalOverlay').classList.remove('show') }

async function handleUpload(type){
  const file=document.getElementById(type+'File').files[0];
  if(!file)return;
  try{
    const path='posters/'+Date.now()+'_'+file.name;
    const {error}=await supabase.storage.from('posters').upload(path,file);
    if(error){alert('上传失败: '+error.message);return}
    const {data}=supabase.storage.from('posters').getPublicUrl(path);
    document.getElementById(type+'Url').value=data.publicUrl;
    showPreview(type,data.publicUrl);
  }catch(e){alert('上传出错: '+e.message)}
}

function showPreview(type,url){
  const img=document.getElementById(type+'Preview');
  const ph=document.getElementById(type+'Placeholder');
  img.src=url; img.style.display='block'; ph.style.display='none';
}
function hidePreview(type){
  const img=document.getElementById(type+'Preview');
  const ph=document.getElementById(type+'Placeholder');
  img.src=''; img.style.display='none'; ph.style.display='block';
}

async function saveSet(){
  const id=document.getElementById('setId').value;
  const name=document.getElementById('setName').value.trim();
  if(!name){alert('请输入套装名称');return}
  const row={name,description:document.getElementById('setDesc').value.trim(),perfect_poster_url:document.getElementById('perfectUrl').value.trim(),normal_poster_url:document.getElementById('normalUrl').value.trim()};
  let result;
  if(id){result=await supabase.from('question_sets').update(row).eq('id',id)}
  else{result=await supabase.from('question_sets').insert(row).select()}
  if(result.error){alert('保存失败: '+result.error.message);return}
  closeSetModal(); loadSets();
}

async function deleteSet(id){
  if(!confirm('删除套装将同时删除其下所有题目，确定？'))return;
  await supabase.from('questions').delete().eq('set_id',id);
  await supabase.from('question_sets').delete().eq('id',id);
  loadSets();
}

// ===== 题目管理 =====
async function loadSetFilter(){
  const {data}=await supabase.from('question_sets').select('id,name');
  document.getElementById('qSetFilter').innerHTML='<option value="">请先选择套装</option>'+(data||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

async function loadQuestions(){
  const setId=document.getElementById('qSetFilter').value;
  if(!setId){document.getElementById('qBody').innerHTML='<tr><td colspan="4" style="color:#999;text-align:center;padding:30px">请先选择套装</td></tr>';return}
  const {data}=await supabase.from('questions').select('*').eq('set_id',setId).order('created_at');
  const tn={single:'单选',multi:'多选',judge:'判断'};
  document.getElementById('qBody').innerHTML=(data||[]).map(q=>`<tr><td>${q.title}</td><td><span class="tag tag-g">${tn[q.type]||q.type}</span></td><td><strong>${q.answer}</strong></td><td><button class="btn btn-xs btn-s" onclick="editQ('${q.id}')">编辑</button> <button class="btn btn-xs btn-r" onclick="deleteQ('${q.id}')">删除</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:#999;text-align:center;padding:30px">暂无题目</td></tr>';
}

function renderOptionInputs(type,values){
  type=type||document.getElementById('qType').value;
  const codes=type==='judge'?['A','B']:['A','B','C','D'];
  const labels=type==='judge'?['正确','错误']:codes;
  document.getElementById('qOptionsContainer').innerHTML=codes.map((c,i)=>{
    const v=values&&values[i]?values[i]:{code:c,content:'',value:'0'};
    return `<div class="option-row">
      <div class="code">${c}</div>
      <input class="input opt-content opt-input" data-code="${c}" placeholder="${labels[i]}" value="${v.content||''}">
      <label><input type="${type==='multi'?'checkbox':'radio'}" name="optCorrect" class="opt-correct" data-code="${c}" ${v.value==='1'?'checked':''}> 正确</label>
    </div>`;
  }).join('');
}

function openQModal(id){
  if(id){
    document.getElementById('qModalTitle').textContent='编辑题目';
    supabase.from('questions').select('*').eq('id',id).single().then(({data:q})=>{
      if(!q)return;
      document.getElementById('qId').value=q.id;
      document.getElementById('qTitle').value=q.title;
      document.getElementById('qType').value=q.type;
      let opts=q.options; if(typeof opts==='string')try{opts=JSON.parse(opts)}catch(e){opts=[]}
      renderOptionInputs(q.type,opts);
    });
  } else {
    document.getElementById('qModalTitle').textContent='添加题目';
    document.getElementById('qId').value='';
    document.getElementById('qTitle').value='';
    document.getElementById('qType').value='single';
    renderOptionInputs('single');
  }
  document.getElementById('qModalOverlay').classList.add('show');
}

function closeQModal(){ document.getElementById('qModalOverlay').classList.remove('show') }

async function saveQ(){
  const id=document.getElementById('qId').value;
  const title=document.getElementById('qTitle').value.trim();
  const type=document.getElementById('qType').value;
  const setId=document.getElementById('qSetFilter').value;
  if(!title||!setId){alert('请填写题目并选择套装');return}

  const contents=document.querySelectorAll('.opt-content');
  const checks=document.querySelectorAll('.opt-correct');
  const options=[]; let answer=[];
  contents.forEach((inp,i)=>{
    const code=inp.dataset.code;
    const checked=checks[i]?checks[i].checked:false;
    options.push({code,content:inp.value.trim(),value:checked?'1':'0'});
    if(checked)answer.push(code);
  });
  if(answer.length===0){alert('请选择正确答案');return}

  const row={set_id:setId,title,type,options,answer:answer.join('')};
  let result;
  if(id){result=await supabase.from('questions').update(row).eq('id',id)}
  else{result=await supabase.from('questions').insert(row)}
  if(result.error){alert('保存失败: '+result.error.message);return}
  closeQModal(); loadQuestions(); loadSets();
}

async function deleteQ(id){
  if(!confirm('确认删除？'))return;
  await supabase.from('questions').delete().eq('id',id);
  loadQuestions(); loadSets();
}

// ===== CSV 导入 =====
function openCSVModal(){
  if(!document.getElementById('qSetFilter').value){alert('请先选择套装');return}
  document.getElementById('csvModalOverlay').classList.add('show');
}
function closeCSVModal(){ document.getElementById('csvModalOverlay').classList.remove('show') }

async function importCSV(){
  const text=document.getElementById('csvText').value.trim();
  if(!text){alert('请粘贴 CSV 内容');return}
  const setId=document.getElementById('qSetFilter').value;
  const lines=text.split('\n').filter(l=>l.trim());
  const rows=[];
  for(const line of lines){
    const parts=parseCSV(line);
    if(parts.length<4)continue;
    const [title,typeStr,answer,...optContents]=parts;
    let type='single';
    if(typeStr.includes('多'))type='multi';
    else if(typeStr.includes('判断'))type='judge';
    const codes=type==='judge'?['A','B']:['A','B','C','D'];
    const options=optContents.slice(0,codes.length).map((ct,i)=>({code:codes[i],content:ct.trim(),value:answer.trim().includes(codes[i])?'1':'0'}));
    rows.push({set_id:setId,title:title.trim(),type,options,answer:answer.trim()});
  }
  if(rows.length===0){alert('未解析到有效题目，请检查格式');return}
  const {error}=await supabase.from('questions').insert(rows);
  if(error){alert('导入失败: '+error.message);return}
  alert(`成功导入 ${rows.length} 道题`);
  closeCSVModal(); loadQuestions(); loadSets();
}

function parseCSV(line){
  const r=[]; let cur='',q=false;
  for(const c of line){if(c==='"'){q=!q}else if(c===','&&!q){r.push(cur);cur=''}else{cur+=c}}
  r.push(cur); return r;
}

// ===== 答题记录 =====
async function loadRecords(){
  const {data}=await supabase.from('quiz_records').select('*').order('created_at',{ascending:false}).limit(50);
  document.getElementById('recordList').innerHTML=(data||[]).map(r=>`
    <div class="record-row"><div><div style="font-weight:600">${r.set_name}</div><div style="font-size:12px;color:#999">${new Date(r.created_at).toLocaleString()} · ${r.right_num}/${r.total_num} 正确</div></div><div class="score${r.is_perfect?' pf':''}">${r.score}</div></div>
  `).join('')||'<p style="color:#999;text-align:center;padding:40px">暂无答题记录</p>';
}

// 初始化
loadSets(); loadSetFilter();
</script>
<div id="dummy" style="display:none"></div>
</body>
</html>
